name: Build Nexus.app (macOS Apple Silicon)

on:
  workflow_dispatch:
    inputs:
      signing:
        description: "Signing mode: development builds Nexus Dev.app; adhoc builds Nexus.app"
        required: true
        type: choice
        default: development
        options:
          - development
          - adhoc
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Nexus / arm64 / ${{ inputs.signing || 'adhoc' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out Nexus
        uses: actions/checkout@v4

      - name: Verify Apple Silicon toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select signing and product identity
        shell: bash
        env:
          REQUESTED_SIGNING: ${{ inputs.signing || 'adhoc' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch && "$REQUESTED_SIGNING" == development ]]; then
            echo "NEXUS_SIGNING=development" >> "$GITHUB_ENV"
            echo "NEXUS_APP_NAME=Nexus Dev" >> "$GITHUB_ENV"
            echo "NEXUS_BUNDLE_ID=com.qssedalto.nexus.dev" >> "$GITHUB_ENV"
            echo "NEXUS_VARIANT=dev" >> "$GITHUB_ENV"
          else
            echo "NEXUS_SIGNING=adhoc" >> "$GITHUB_ENV"
            echo "NEXUS_APP_NAME=Nexus" >> "$GITHUB_ENV"
            echo "NEXUS_BUNDLE_ID=com.qssedalto.nexus" >> "$GITHUB_ENV"
            echo "NEXUS_VARIANT=production" >> "$GITHUB_ENV"
          fi

      - name: Import Apple Development signing certificate
        if: env.NEXUS_SIGNING == 'development'
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$BUILD_CERTIFICATE_BASE64" || -z "$P12_PASSWORD" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "::error::Please configure BUILD_CERTIFICATE_BASE64, P12_PASSWORD, and KEYCHAIN_PASSWORD in Actions Secrets."
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/nexus-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/nexus-build.keychain-db"
          trap 'rm -f "$CERT_PATH"' EXIT

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | /usr/bin/base64 -D -o "$CERT_PATH"
          /usr/bin/security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          /usr/bin/security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          /usr/bin/security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          /usr/bin/security list-keychains -d user -s "$KEYCHAIN_PATH"
          /usr/bin/security default-keychain -s "$KEYCHAIN_PATH"
          /usr/bin/security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
          /usr/bin/security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Match the user's Apple Development Team, never an unrelated signing identity.
          SIGNING_IDENTITY="$(/usr/bin/security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | /usr/bin/awk '/Apple Development:/ && /\(4QYM64TMA2\)/ { print $2; exit }')"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "::error::No valid Apple Development identity for team 4QYM64TMA2 exists in the imported P12."
            exit 1
          fi

          # The human-readable name can contain an account/team label that differs
          # from the signing certificate's real TeamIdentifier. Read the latter
          # from codesign, and use it consistently across app and extension.
          PROBE_DIR="$(mktemp -d "$RUNNER_TEMP/nexus-signing-probe.XXXXXX")"
          cp /usr/bin/true "$PROBE_DIR/probe"
          /usr/bin/codesign --force --sign "$SIGNING_IDENTITY" "$PROBE_DIR/probe"
          ACTUAL_TEAM="$(/usr/bin/codesign -dv --verbose=4 "$PROBE_DIR/probe" 2>&1 \
            | /usr/bin/awk -F= '/^TeamIdentifier=/ { print $2; exit }')"
          rm -rf "$PROBE_DIR"
          if [[ -z "$ACTUAL_TEAM" || "$ACTUAL_TEAM" == "not set" || ! "$ACTUAL_TEAM" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::Unable to determine a valid TeamIdentifier from the imported signing identity."
            exit 1
          fi
          echo "Validated Apple Development signing team: $ACTUAL_TEAM"
          echo "NEXUS_SIGN_ID=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "NEXUS_SIGNING_TEAM=$ACTUAL_TEAM" >> "$GITHUB_ENV"

      - name: Compile and sign Nexus
        shell: bash
        env:
          APP_NAME: ${{ env.NEXUS_APP_NAME }}
          BUNDLE_ID: ${{ env.NEXUS_BUNDLE_ID }}
          APP_VARIANT: ${{ env.NEXUS_VARIANT }}
          SIGNING_MODE: ${{ env.NEXUS_SIGNING }}
          APP_IDENTITY: ${{ env.NEXUS_SIGN_ID }}
          TEAM_ID: ${{ env.NEXUS_SIGNING_TEAM }}
          ARCHES: arm64
          ALLOW_MISSING_SPARKLE_FOR_LOCAL_RUN: "1"
          ENABLE_SPARKLE_AUTOMATIC_CHECKS: "false"
        run: |
          set -euo pipefail
          if [[ "$SIGNING_MODE" == development ]]; then
            ./Scripts/package_app.sh release --dev
          else
            ./Scripts/package_app.sh release --production
          fi

      - name: Verify app identity, architecture, extension and signature
        shell: bash
        run: |
          set -euo pipefail
          APP="${NEXUS_APP_NAME}.app"
          EXT="$APP/Contents/PlugIns/NexusFinderSync.appex"
          APP_INFO="$APP/Contents/Info.plist"
          EXT_INFO="$EXT/Contents/Info.plist"
          test -d "$APP" && test -f "$EXT_INFO"

          /usr/bin/plutil -lint "$APP_INFO" "$EXT_INFO"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_INFO")" = "$NEXUS_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT_INFO")" = "$NEXUS_BUNDLE_ID.findersync"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NexusBuildVariant' "$APP_INFO")" = "$NEXUS_VARIANT"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUEnableAutomaticChecks' "$APP_INFO")" = "false"
          test -z "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$APP_INFO")"
          test "$(/usr/bin/lipo -archs "$APP/Contents/MacOS/$NEXUS_APP_NAME")" = "arm64"

          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/bin/codesign --verify --strict --verbose=2 "$EXT"

          if [[ "$NEXUS_SIGNING" == development ]]; then
            # Check both signatures against the team derived from the exact
            # certificate we imported, never a hard-coded display-name suffix.
            APP_TEAM="$(/usr/bin/codesign -dv --verbose=4 "$APP" 2>&1 \
              | /usr/bin/awk -F= '/^TeamIdentifier=/ { print $2; exit }')"
            EXT_TEAM="$(/usr/bin/codesign -dv --verbose=4 "$EXT" 2>&1 \
              | /usr/bin/awk -F= '/^TeamIdentifier=/ { print $2; exit }')"
            if [[ -z "$APP_TEAM" || "$APP_TEAM" != "$NEXUS_SIGNING_TEAM" || "$EXT_TEAM" != "$APP_TEAM" ]]; then
              echo "::error::App and extension must both use the imported certificate's TeamIdentifier."
              exit 1
            fi

            EXPECTED_GROUP="$APP_TEAM.$NEXUS_BUNDLE_ID.shared"
            APP_GROUP="$(/usr/libexec/PlistBuddy -c 'Print :NexusAppGroupIdentifier' "$APP_INFO")"
            EXT_GROUP="$(/usr/libexec/PlistBuddy -c 'Print :NexusAppGroupIdentifier' "$EXT_INFO")"
            if [[ "$APP_GROUP" != "$EXPECTED_GROUP" || "$EXT_GROUP" != "$EXPECTED_GROUP" ]]; then
              echo "::error::App Group identifier does not match the signing team or bundle identifier."
              exit 1
            fi
            echo "Verified common signing TeamIdentifier: $APP_TEAM"
          fi

      - name: Create downloadable app ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Nexus-macOS-arm64-${NEXUS_SIGNING}.zip"
          /usr/bin/ditto --norsrc -c -k --keepParent "${NEXUS_APP_NAME}.app" "$ZIP"
          /usr/bin/unzip -tq "$ZIP"
          test -s "$ZIP"

      - name: Upload compiled app
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-macOS-arm64-${{ env.NEXUS_SIGNING }}-${{ github.run_number }}
          path: Nexus-macOS-arm64-${{ env.NEXUS_SIGNING }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Nexus macOS build"
            echo ""
            echo "- Build: Release configuration, Apple Silicon arm64"
            echo "- App: ${NEXUS_APP_NAME}.app"
            echo "- Bundle ID: ${NEXUS_BUNDLE_ID}"
            echo "- Signing: ${NEXUS_SIGNING}"
            echo "- Artifact: Nexus-macOS-arm64-${NEXUS_SIGNING}-${GITHUB_RUN_NUMBER}"
            echo "- Not Developer ID notarized: builds are for testing only. Finder Sync and App Groups require compatible entitlements and may require provisioning profiles."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete temporary signing keychain
        if: always()
        shell: bash
        run: |
          /bin/rm -f "$RUNNER_TEMP/nexus-signing.p12"
          if [[ -f "$RUNNER_TEMP/nexus-build.keychain-db" ]]; then
            /usr/bin/security delete-keychain "$RUNNER_TEMP/nexus-build.keychain-db" || true
          fi
