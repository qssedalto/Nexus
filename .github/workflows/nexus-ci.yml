name: Nexus macOS build and identity checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version
      - name: Verify source identity
        run: |
          test -f Nexus.xcodeproj/project.pbxproj
          test -f Nexus.xcodeproj/xcshareddata/xcschemes/Nexus.xcscheme
          test -d Sources/Nexus
          test -d Sources/NexusCore
          test -d Sources/NexusFinderSync
          if git ls-files | grep -i slashgrab | grep -v '^.recovery/'; then
            echo 'Legacy-branded file paths remain outside recovery archives' >&2
            exit 1
          fi
          plutil -lint Config/Nexus-Info.plist Config/NexusFinderSync-Info.plist Config/Nexus.entitlements Config/NexusFinderSync.entitlements
          bash -n Scripts/*.sh ci.sh
      - name: SwiftPM and Xcode test suites
        run: ./Scripts/test.sh
      - name: Verify unsigned-build packaging and bundle names
        run: |
          ./Scripts/build_and_run.sh --verify
          APP="Nexus Dev.app"
          APP_INFO="$APP/Contents/Info.plist"
          EXT_INFO="$APP/Contents/PlugIns/NexusFinderSync.appex/Contents/Info.plist"
          test -f "$APP_INFO"
          test -f "$EXT_INFO"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_INFO")" = "com.qssedalto.nexus.dev"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT_INFO")" = "com.qssedalto.nexus.dev.findersync"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NexusBuildVariant' "$APP_INFO")" = "dev"
