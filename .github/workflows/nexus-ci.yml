name: Nexus macOS build and identity checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: nexus-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version
      - name: Verify source identity
        run: |
          test -f Nexus.xcodeproj/project.pbxproj
          test -f Nexus.xcodeproj/xcshareddata/xcschemes/Nexus.xcscheme
          test -d Sources/Nexus
          test -d Sources/NexusCore
          test -d Sources/NexusFinderSync
          if git ls-files | grep -i slashgrab | grep -v '^.recovery/'; then
            echo 'Legacy-branded file paths remain outside recovery archives' >&2
            exit 1
          fi
          plutil -lint Config/Nexus-Info.plist Config/NexusFinderSync-Info.plist Config/Nexus.entitlements Config/NexusFinderSync.entitlements
          bash -n Scripts/*.sh ci.sh
      - name: SwiftPM and Xcode test suites
        run: ./Scripts/test.sh
      - name: Guard against stale checked-in Xcode project
        run: |
          # Scripts/test.sh regenerates the project with XcodeGen.
          # A passing build must also match the project committed to the repo.
          git diff --exit-code -- Nexus.xcodeproj/project.pbxproj Nexus.xcodeproj/xcshareddata/xcschemes/Nexus.xcscheme
      - name: Verify unsigned-build packaging and bundle names
        run: |
          ./Scripts/build_and_run.sh --verify
          APP="Nexus Dev.app"
          APP_INFO="$APP/Contents/Info.plist"
          EXT_INFO="$APP/Contents/PlugIns/NexusFinderSync.appex/Contents/Info.plist"
          test -f "$APP_INFO"
          test -f "$EXT_INFO"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_INFO")" = "com.qssedalto.nexus.dev"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT_INFO")" = "com.qssedalto.nexus.dev.findersync"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NexusBuildVariant' "$APP_INFO")" = "dev"
          # Finder Sync is suppressed in File Provider locations such as iCloud.
          # The default Nexus app must also advertise its native Services fallback.
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSServices:0:NSMessage' "$APP_INFO")" = "copySelectedPaths"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSServices:0:NSSendFileTypes:0' "$APP_INFO")" = "public.item"
          if /usr/libexec/PlistBuddy -c 'Print :NSServices:1' "$APP_INFO" >/dev/null 2>&1; then
            echo 'ERROR: Nexus declares overlapping native copy-path Services' >&2
            exit 1
          fi
          # A normal test build must not falsely claim a provisioned iCloud container.
          if /usr/libexec/PlistBuddy -c 'Print :NexusCloudKitContainerIdentifier' "$APP_INFO" >/dev/null 2>&1; then
            echo 'ERROR: default build unexpectedly advertises CloudKit' >&2
            exit 1
          fi

      # An unprovisioned compatibility preview, NOT an enabled CloudKit client.
      # With an actual paid profile the existing package_app.sh flow must be
      # run separately and verify its provisioned entitlements.
      - name: Build isolated CloudKit-track preview (no iCloud entitlement)
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/cloudkit-provisioned-track'
        shell: bash
        run: |
          set -euo pipefail
          APP_NAME="Nexus CloudKit Dev" BUNDLE_ID="com.qssedalto.nexus.cloudkit.dev" ARCHES=arm64 ./Scripts/package_app.sh release --dev
          APP="Nexus CloudKit Dev.app"
          INFO="$APP/Contents/Info.plist"
          EXT="$APP/Contents/PlugIns/NexusFinderSync.appex"
          test -d "$APP" && test -d "$EXT"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")" = "com.qssedalto.nexus.cloudkit.dev"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT/Contents/Info.plist")" = "com.qssedalto.nexus.cloudkit.dev.findersync"
          if /usr/libexec/PlistBuddy -c 'Print :NexusCloudKitContainerIdentifier' "$INFO" >/dev/null 2>&1; then
            echo "::error::Unprovisioned preview must not claim an actual CloudKit container."
            exit 1
          fi
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/bin/codesign --verify --strict --verbose=2 "$EXT"
          /usr/bin/codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/nexus-cloudkit-preview-entitlements.plist" 2>/dev/null
          if /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.icloud-services' "$RUNNER_TEMP/nexus-cloudkit-preview-entitlements.plist" >/dev/null 2>&1; then
            echo "::error::Unprovisioned preview must not have iCloud services entitlement."
            exit 1
          fi
          test "$(/usr/bin/lipo -archs "$APP/Contents/MacOS/Nexus CloudKit Dev")" = arm64
          mkdir -p "$RUNNER_TEMP/nexus-cloudkit-preview-dist"
          ZIP="$RUNNER_TEMP/nexus-cloudkit-preview-dist/Nexus-CloudKit-Dev-unprovisioned-preview-macOS-arm64.zip"
          /usr/bin/ditto --norsrc -c -k --keepParent "$APP" "$ZIP"
          /usr/bin/unzip -tq "$ZIP"
          {
            echo "## Nexus CloudKit-track compatibility preview"
            echo ""
            echo "- Artifact: **Nexus-CloudKit-Dev-unprovisioned-preview-macOS-arm64-${GITHUB_RUN_NUMBER}**"
            echo "- No CloudKit container or entitlement. **Cross-device CloudKit sync WILL NOT work**."
            echo "- This ZIP is for UI/compatibility preview only; paid Apple Developer team, registered container and matching profile are needed to build the enabled variant."
            echo "- Isolated bundle ID; Ad Hoc signed, not notarized."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unprovisioned CloudKit-track preview ZIP
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/cloudkit-provisioned-track'
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-CloudKit-Dev-unprovisioned-preview-macOS-arm64-${{ github.run_number }}
          path: ${{ runner.temp }}/nexus-cloudkit-preview-dist/Nexus-CloudKit-Dev-unprovisioned-preview-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
