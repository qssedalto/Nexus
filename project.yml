name: Nexus

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "13.0"
  defaultConfig: Debug
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release: release
  Local: release
  ServicesPrototype: debug
  ServicesOnly: release

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.2

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_LDFLAGS: "$(inherited) -lsqlite3"
    MARKETING_VERSION: ${MARKETING_VERSION}
    CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
  configs:
    Debug:
      APP_DISPLAY_NAME: Nexus Dev
      APP_BUNDLE_ID: com.qssedalto.nexus.dev
      APP_ICON_NAME: AppIconDev
      APP_GROUP_ID: $(DEVELOPMENT_TEAM).com.qssedalto.nexus.dev.shared
      LEGACY_APP_GROUP_ID: $(DEVELOPMENT_TEAM).com.prof18.slashgrab.dev.shared
      FINDER_EXTENSION_BUNDLE_ID: com.qssedalto.nexus.dev.findersync
      FINDER_EXTENSION_DISPLAY_NAME: Nexus Dev Finder Extension
    Release:
      APP_DISPLAY_NAME: Nexus
      APP_BUNDLE_ID: com.qssedalto.nexus
      APP_ICON_NAME: AppIcon
      APP_GROUP_ID: $(DEVELOPMENT_TEAM).com.qssedalto.nexus.shared
      LEGACY_APP_GROUP_ID: $(DEVELOPMENT_TEAM).com.prof18.slashgrab.shared
      FINDER_EXTENSION_BUNDLE_ID: com.qssedalto.nexus.findersync
      FINDER_EXTENSION_DISPLAY_NAME: Nexus Finder Extension
    Local:
      APP_DISPLAY_NAME: Nexus
      APP_BUNDLE_ID: com.qssedalto.nexus.local
      APP_ICON_NAME: AppIcon
      APP_GROUP_ID: $(DEVELOPMENT_TEAM).com.qssedalto.nexus.local.shared
      LEGACY_APP_GROUP_ID: $(DEVELOPMENT_TEAM).com.prof18.slashgrab.local.shared
      FINDER_EXTENSION_BUNDLE_ID: com.qssedalto.nexus.local.findersync
      FINDER_EXTENSION_DISPLAY_NAME: Nexus Finder Extension
    ServicesPrototype:
      APP_DISPLAY_NAME: Nexus Services Prototype
      APP_BUNDLE_ID: com.qssedalto.nexus.servicesprototype.dev
      APP_ICON_NAME: AppIconDev
      APP_GROUP_ID: $(DEVELOPMENT_TEAM).com.qssedalto.nexus.servicesprototype.dev.shared
      LEGACY_APP_GROUP_ID: $(DEVELOPMENT_TEAM).com.prof18.slashgrab.servicesprototype.dev.shared
      FINDER_EXTENSION_BUNDLE_ID: com.qssedalto.nexus.servicesprototype.dev.findersync
      FINDER_EXTENSION_DISPLAY_NAME: Nexus Services Prototype Finder Extension
    ServicesOnly:
      APP_DISPLAY_NAME: Nexus
      APP_BUNDLE_ID: com.qssedalto.nexus
      APP_ICON_NAME: AppIcon
      APP_GROUP_ID: $(DEVELOPMENT_TEAM).com.qssedalto.nexus.shared
      LEGACY_APP_GROUP_ID: $(DEVELOPMENT_TEAM).com.prof18.slashgrab.shared
      FINDER_EXTENSION_BUNDLE_ID: com.qssedalto.nexus.findersync
      FINDER_EXTENSION_DISPLAY_NAME: Nexus Finder Extension

targets:
  NexusCore:
    type: library.static
    platform: macOS
    sources:
      - Sources/NexusCore
    settings:
      base:
        PRODUCT_NAME: NexusCore
    dependencies:
      - sdk: CloudKit.framework

  NexusFinderSync:
    type: app-extension
    platform: macOS
    sources:
      - Sources/NexusFinderSync
    info:
      path: Config/NexusFinderSync-Info.plist
      properties:
        CFBundleDisplayName: $(FINDER_EXTENSION_DISPLAY_NAME)
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NexusAppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionAttributes: {}
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    entitlements:
      path: Config/NexusFinderSync.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
          - $(LEGACY_APP_GROUP_ID)
    settings:
      base:
        PRODUCT_NAME: NexusFinderSync
        PRODUCT_BUNDLE_IDENTIFIER: $(FINDER_EXTENSION_BUNDLE_ID)
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
      configs:
        ServicesPrototype:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NEXUS_SERVICE_PROTOTYPE"
        ServicesOnly:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NEXUS_SERVICE_PROTOTYPE"
    dependencies:
      - target: NexusCore
      - sdk: AppKit.framework
      - sdk: FinderSync.framework

  Nexus:
    type: application
    platform: macOS
    sources:
      - path: Sources/Nexus
        excludes:
          - Resources/AppIconDev.icon
      - path: Scripts/Assets/AppIconDev.icon
        buildPhase: resources
    info:
      path: Config/Nexus-Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleIconName: $(APP_ICON_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: Copyright © 2026 qssedalto. Portions © 2026 Marco Gomiero.
        NSPrincipalClass: NSApplication
        NexusAppGroupIdentifier: $(APP_GROUP_ID)
        NexusCloudKitContainerIdentifier: $(NEXUS_CLOUDKIT_CONTAINER_ID)
    entitlements:
      path: Config/Nexus.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
          - $(LEGACY_APP_GROUP_ID)
    settings:
      base:
        PRODUCT_NAME: $(APP_DISPLAY_NAME)
        PRODUCT_MODULE_NAME: Nexus
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: $(APP_ICON_NAME)
      configs:
        ServicesPrototype:
          INFOPLIST_FILE: Config/Nexus-ServicesPrototype-Info.plist
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NEXUS_SERVICE_PROTOTYPE"
        ServicesOnly:
          INFOPLIST_FILE: Config/Nexus-ServicesPrototype-Info.plist
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NEXUS_SERVICE_PROTOTYPE"
    dependencies:
      - target: NexusCore
      - target: NexusFinderSync
        embed: true
      - package: Sparkle
        product: Sparkle
      - sdk: FinderSync.framework

  NexusCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/NexusCoreTests
    dependencies:
      - target: NexusCore
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  NexusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/NexusTests
    dependencies:
      - target: Nexus
      - target: NexusCore
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(APP_DISPLAY_NAME).app/Contents/MacOS/$(APP_DISPLAY_NAME)
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Nexus:
    build:
      targets:
        Nexus: all
        NexusCoreTests: [test]
        NexusTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - NexusCoreTests
        - NexusTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
